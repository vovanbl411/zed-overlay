---
name: Zed release watcher

on:
  schedule:
    # 06:17 UTC: avoid the top-of-hour Actions load peak.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-release-watcher
  cancel-in-progress: false

jobs:
  check:
    name: Check stable Zed release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      handoff_ready: ${{ steps.prepare-and-validate.outputs.handoff_ready }}
    env:
      GENTOO_PORTAGE_IMAGE: gentoo/portage@sha256:ce69e5b771bfe9404731e846b835346c34f2c82817ac3626f13af198689a1961
      GENTOO_STAGE3_IMAGE: gentoo/stage3@sha256:d8536e52677e3efe4caf048ca588bc685bc2d24d7fdfc882de1cdc6d38c81d96
    steps:
      - name: Check out the overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check overlay policy
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/overlay_policy.py

      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: Check upstream stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_handoff.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare and validate disposable candidate
        id: prepare-and-validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tracked_paths="$RUNNER_TEMP/zed-overlay-tracked-paths"
          disposable_workspace="$RUNNER_TEMP/zed-overlay"
          before_paths="$RUNNER_TEMP/zed-overlay-before-paths"
          prepare_log="$RUNNER_TEMP/zed-overlay-prepare.log"
          echo "handoff_ready=false" >> "$GITHUB_OUTPUT"

          git -C "$GITHUB_WORKSPACE" ls-files -z > "$tracked_paths"
          mkdir -p "$disposable_workspace"
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$disposable_workspace"
          test ! -e "$disposable_workspace/.git"

          cd "$disposable_workspace"
          manifest_checksum="$(sha256sum app-editors/zed/Manifest)"
          find app-editors/zed -type f -print0 | sort -z > "$before_paths"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_handoff.py --prepare | tee "$prepare_log" | tee -a "$GITHUB_STEP_SUMMARY"
          test ! -e .git
          test "$manifest_checksum" = "$(sha256sum app-editors/zed/Manifest)"

          mapfile -d '' -t candidate_paths < <(
            comm -z -13 "$before_paths" <(find app-editors/zed -type f -print0 | sort -z)
          )
          if grep -Fxq 'Result: new-release' "$prepare_log"; then
            candidate_ebuild="$(printf '%s\n' "${candidate_paths[@]}" | grep -Ex 'app-editors/zed/zed-[0-9]+\.[0-9]+\.[0-9]+\.ebuild')"
            candidate_patch="app-editors/zed/files/$(basename "${candidate_ebuild%.ebuild}")-wayland-only.patch"
            test -f "$candidate_ebuild"
            test -f "$candidate_patch"
            if [ "${#candidate_paths[@]}" -eq 1 ]; then
              test "${candidate_paths[0]}" = "$candidate_ebuild"
            else
              test "${#candidate_paths[@]}" -eq 2
              printf '%s\n' "${candidate_paths[@]}" | sort | cmp -s - <(
                printf '%s\n' "$candidate_ebuild" "$candidate_patch" | sort
              )
            fi

            candidate_atom="=app-editors/${candidate_ebuild##*/}"
            candidate_atom="${candidate_atom%.ebuild}::zed-overlay"
            candidate_version="${candidate_ebuild##*/zed-}"
            candidate_version="${candidate_version%.ebuild}"
            docker create --name zed-portage "$GENTOO_PORTAGE_IMAGE" /bin/true
            cleanup() {
              docker rm -f zed-portage >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            docker run --rm \
              --volumes-from zed-portage \
              --mount "type=bind,src=$disposable_workspace,dst=/overlay" \
              --workdir /overlay \
              --env CANDIDATE_ATOM="$candidate_atom" \
              --env CANDIDATE_EBUILD="/overlay/$candidate_ebuild" \
              --env CANDIDATE_PATCH="/overlay/$candidate_patch" \
              --env CANDIDATE_VERSION="$candidate_version" \
              "$GENTOO_STAGE3_IMAGE" \
              /bin/bash -e -c '
                mkdir -p /etc/portage/repos.conf /etc/portage/package.accept_keywords /etc/portage/package.use
                printf "%s\\n" \
                  "[DEFAULT]" \
                  "main-repo = gentoo" \
                  "" \
                  "[gentoo]" \
                  "location = /var/db/repos/gentoo" \
                  "auto-sync = no" \
                  "" \
                  "[zed-overlay]" \
                  "location = /overlay" \
                  "masters = gentoo" \
                  "auto-sync = no" \
                  > /etc/portage/repos.conf/zed-overlay.conf
                printf "%s ~amd64\\n" "$CANDIDATE_ATOM" \
                  > /etc/portage/package.accept_keywords/zed-candidate
                printf "%s\\n" \
                  "media-libs/vulkan-loader wayland" \
                  "media-video/pipewire sound-server" \
                  > /etc/portage/package.use/zed-validation
                ebuild "$CANDIDATE_EBUILD" manifest
                emerge -pv --oneshot "$CANDIDATE_ATOM"
                patch_root="$(mktemp -d)"
                distdir="$(portageq envvar DISTDIR)"
                test -n "$distdir"
                source_archive="$distdir/zed-${CANDIDATE_VERSION}.tar.gz"
                test -f "$source_archive"
                tar -xzf "$source_archive" -C "$patch_root"
                PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_zed_cargo_snapshot.py \
                  --ebuild "$CANDIDATE_EBUILD" \
                  --source "$patch_root/zed-${CANDIDATE_VERSION}"
                if patch --dry-run -p1 -d "$patch_root/zed-${CANDIDATE_VERSION}" < "$CANDIDATE_PATCH"; then
                  echo "Wayland patch dry-run: OK"
                else
                  echo "ERROR: Wayland patch dry-run failed" >&2
                  exit 1
                fi
              '

            if test ! -e .git; then
              echo "Git-less workspace after container validation: OK"
            else
              echo "ERROR: disposable workspace gained .git" >&2
              exit 1
            fi

            if test "$manifest_checksum" != "$(sha256sum app-editors/zed/Manifest)"; then
              echo "Manifest update after container validation: OK"
            else
              echo "ERROR: app-editors/zed/Manifest was not updated by container validation" >&2
              exit 1
            fi
          else
            grep -Fxq 'Result: up-to-date' "$prepare_log"
            test "${#candidate_paths[@]}" -eq 0
          fi

          if PYTHONDONTWRITEBYTECODE=1 python3 scripts/overlay_policy.py \
            --root "$disposable_workspace" \
            --tracked-paths-file "$tracked_paths"; then
            echo "Overlay policy for disposable workspace: OK"
          else
            echo "ERROR: overlay policy failed for disposable workspace" >&2
            exit 1
          fi

          if test ! -e "$disposable_workspace/.git"; then
            echo "Git-less workspace after overlay policy: OK"
          else
            echo "ERROR: disposable workspace gained .git after overlay policy" >&2
            exit 1
          fi

          source_status="$(git -C "$GITHUB_WORKSPACE" status --short)"
          if test -z "$source_status"; then
            echo "Source workspace remains clean: OK"
          else
            echo "ERROR: source workspace was modified" >&2
            printf '%s\n' "$source_status" | sed -n '1,25p' >&2
            exit 1
          fi

          if grep -Fxq 'Result: new-release' "$prepare_log"; then
            handoff_directory="$RUNNER_TEMP/release-handoff"
            PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_handoff.py \
              --create-handoff "$handoff_directory" \
              --candidate-version "$candidate_version" \
              --base-commit "$GITHUB_SHA"
            echo "Sanitized release handoff: OK"
            echo "handoff_ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release handoff
        if: steps.prepare-and-validate.outputs.handoff_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-handoff
          path: ${{ runner.temp }}/release-handoff
          if-no-files-found: error
          retention-days: 14

  validate-release-handoff:
    name: Validate release handoff
    needs: check
    if: needs.check.outputs.handoff_ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download release handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-handoff
          path: ${{ runner.temp }}/release-handoff

      - name: Validate release handoff boundary
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_handoff.py \
            --validate-handoff "$RUNNER_TEMP/release-handoff" \
            --expected-base-commit "$GITHUB_SHA"
          echo "Release handoff boundary: OK"

  publish-draft-release-pr:
    name: Publish Draft release PR
    needs: [check, validate-release-handoff]
    if: >-
      needs.check.outputs.handoff_ready == 'true' &&
      needs['validate-release-handoff'].result == 'success' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download release handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-handoff
          path: ${{ runner.temp }}/release-handoff

      - name: Apply validated release handoff
        id: apply-handoff
        shell: bash
        run: |
          set -euo pipefail
          checkout_status="$(git status --short)"
          if test -n "$checkout_status"; then
            echo "ERROR: fresh main checkout is not clean" >&2
            printf '%s\n' "$checkout_status" >&2
            exit 1
          fi
          base_commit="$(git rev-parse HEAD)"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_handoff.py \
            --apply-handoff "$RUNNER_TEMP/release-handoff" \
            --repository-root "$GITHUB_WORKSPACE" \
            --expected-base-commit "$base_commit" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check overlay policy after handoff apply
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/overlay_policy.py

      - name: Stage and validate exact release diff
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.apply-handoff.outputs.candidate_version }}
          PATCH_CREATED: ${{ steps.apply-handoff.outputs.patch_created }}
        run: |
          set -euo pipefail
          candidate_ebuild="app-editors/zed/zed-${CANDIDATE_VERSION}.ebuild"
          candidate_patch="app-editors/zed/files/zed-${CANDIDATE_VERSION}-wayland-only.patch"
          git add app-editors/zed/Manifest "$candidate_ebuild" "$candidate_patch"
          git diff --cached --check

          expected_paths="$RUNNER_TEMP/zed-release-expected-paths"
          {
            printf '%s\n' app-editors/zed/Manifest "$candidate_ebuild"
            if test "$PATCH_CREATED" = true; then
              printf '%s\n' "$candidate_patch"
            fi
          } | sort > "$expected_paths"
          actual_paths="$(git diff --cached --name-only | sort)"
          if ! printf '%s\n' "$actual_paths" | cmp -s "$expected_paths" -; then
            echo "ERROR: staged paths do not match the release handoff allowlist" >&2
            echo "Expected:" >&2
            cat "$expected_paths" >&2
            echo "Actual:" >&2
            printf '%s\n' "$actual_paths" >&2
            exit 1
          fi
          if test -n "$(git diff --name-only)"; then
            echo "ERROR: unstaged tracked changes remain after handoff apply" >&2
            git diff --name-only >&2
            exit 1
          fi
          if test -n "$(git ls-files --others --exclude-standard)"; then
            echo "ERROR: unexpected untracked files remain after handoff apply" >&2
            git ls-files --others --exclude-standard >&2
            exit 1
          fi

      - name: Check existing automation PR and branch
        id: existing-automation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.apply-handoff.outputs.branch }}
        run: |
          set -euo pipefail
          pull_response="$RUNNER_TEMP/zed-release-pulls.json"
          curl --fail --silent --show-error --get \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "state=open" \
            --data-urlencode "base=main" \
            --data-urlencode "head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
            --data-urlencode "per_page=1" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls" \
            > "$pull_response"
          existing_pr_url="$(python3 - "$pull_response" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              payload = json.load(response)
          if not isinstance(payload, list):
              raise SystemExit("Pull request query returned an invalid response")
          if payload:
              url = payload[0].get("html_url")
              if not isinstance(url, str):
                  raise SystemExit("Existing pull request has no URL")
              print(url)
          PY
          )"
          if test -n "$existing_pr_url"; then
            echo "existing_pr=true" >> "$GITHUB_OUTPUT"
            printf 'Existing automation PR: %s\n' "$existing_pr_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch_response="$RUNNER_TEMP/zed-release-branch.json"
          branch_status="$(curl --silent --show-error --output "$branch_response" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH")"
          case "$branch_status" in
            404) echo "existing_pr=false" >> "$GITHUB_OUTPUT" ;;
            200)
              echo "ERROR: remote automation branch exists without an open PR: $BRANCH" >&2
              exit 1
              ;;
            *)
              echo "ERROR: could not determine remote branch state (HTTP $branch_status)" >&2
              exit 1
              ;;
          esac

      - name: Commit and push automation branch
        if: steps.existing-automation.outputs.existing_pr != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.apply-handoff.outputs.branch }}
          CANDIDATE_VERSION: ${{ steps.apply-handoff.outputs.candidate_version }}
        run: |
          set -euo pipefail
          git switch --create "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "ERROR: release handoff would create an empty commit" >&2
            exit 1
          fi
          git commit -m "update: Zed v${CANDIDATE_VERSION}"

          original_remote="$(git remote get-url origin)"
          restore_origin() {
            git remote set-url origin "$original_remote"
          }
          trap restore_origin EXIT
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Create Draft release PR
        if: steps.existing-automation.outputs.existing_pr != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.apply-handoff.outputs.branch }}
          CANDIDATE_VERSION: ${{ steps.apply-handoff.outputs.candidate_version }}
        run: |
          set -euo pipefail
          payload="$(python3 - "$CANDIDATE_VERSION" "$BRANCH" <<'PY'
          import json
          import sys

          version, branch = sys.argv[1:]
          body = f'''## Automated validation

          - Stable release discovered
          - Manifest generated
          - Portage dependency resolution passed
          - Wayland-only patch applies cleanly
          - Overlay policy passed
          - Sanitized handoff validated

          ## Manual acceptance required before merge

          - [ ] Review upstream release notes
          - [ ] Review ebuild / Manifest / Wayland patch diff
          - [ ] Full `emerge -1av =app-editors/zed-{version}::zed-overlay`
          - [ ] Verify linkage (`scanelf` / `lddtree`) remains free of unwanted X11 runtime linkage
          - [ ] Verify native Wayland startup/runtime
          '''
          print(json.dumps({
              "title": f"[release-bump] Zed v{version}",
              "head": branch,
              "base": "main",
              "draft": True,
              "body": body,
          }))
          PY
          )"
          pr_response="$RUNNER_TEMP/zed-release-pr.json"
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls" \
            > "$pr_response"
          pr_url="$(python3 - "$pr_response" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              url = json.load(response).get("html_url")
          if not isinstance(url, str):
              raise SystemExit("Created pull request has no URL")
          print(url)
          PY
          )"
          printf 'Created draft automation PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
