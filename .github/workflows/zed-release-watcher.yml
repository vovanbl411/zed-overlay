---
name: Zed release watcher

on:
  schedule:
    # 06:17 UTC: avoid the top-of-hour Actions load peak.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-release-watcher
  cancel-in-progress: false

jobs:
  check:
    name: Check stable Zed release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GENTOO_PORTAGE_IMAGE: gentoo/portage@sha256:ce69e5b771bfe9404731e846b835346c34f2c82817ac3626f13af198689a1961
      GENTOO_STAGE3_IMAGE: gentoo/stage3@sha256:d8536e52677e3efe4caf048ca588bc685bc2d24d7fdfc882de1cdc6d38c81d96
    steps:
      - name: Check out the overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check overlay policy
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/overlay_policy.py

      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v

      - name: Check upstream stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_handoff.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare and validate disposable candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tracked_paths="$RUNNER_TEMP/zed-overlay-tracked-paths"
          disposable_workspace="$RUNNER_TEMP/zed-overlay"
          before_paths="$RUNNER_TEMP/zed-overlay-before-paths"
          prepare_log="$RUNNER_TEMP/zed-overlay-prepare.log"

          git -C "$GITHUB_WORKSPACE" ls-files -z > "$tracked_paths"
          mkdir -p "$disposable_workspace"
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$disposable_workspace"
          test ! -e "$disposable_workspace/.git"

          cd "$disposable_workspace"
          manifest_checksum="$(sha256sum app-editors/zed/Manifest)"
          find app-editors/zed -type f -print0 | sort -z > "$before_paths"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_handoff.py --prepare | tee "$prepare_log" | tee -a "$GITHUB_STEP_SUMMARY"
          test ! -e .git
          test "$manifest_checksum" = "$(sha256sum app-editors/zed/Manifest)"

          mapfile -d '' -t candidate_paths < <(
            comm -z -13 "$before_paths" <(find app-editors/zed -type f -print0 | sort -z)
          )
          if grep -Fxq 'Result: new-release' "$prepare_log"; then
            test "${#candidate_paths[@]}" -eq 2
            candidate_ebuild="$(printf '%s\n' "${candidate_paths[@]}" | grep -Ex 'app-editors/zed/zed-[0-9]+\.[0-9]+\.[0-9]+\.ebuild')"
            candidate_patch="app-editors/zed/files/$(basename "${candidate_ebuild%.ebuild}")-wayland-only.patch"
            test -f "$candidate_ebuild"
            test -f "$candidate_patch"

            before_container_paths="$RUNNER_TEMP/zed-overlay-before-container-paths"
            before_container_hashes="$RUNNER_TEMP/zed-overlay-before-container-hashes"
            find . -type f -print0 | sort -z > "$before_container_paths"
            find . -type f ! -path './app-editors/zed/Manifest' -print0 | sort -z | xargs -0 sha256sum > "$before_container_hashes"
            manifest_before_container="$RUNNER_TEMP/zed-overlay-before-container-Manifest"
            cp app-editors/zed/Manifest "$manifest_before_container"

            candidate_atom="=app-editors/${candidate_ebuild##*/}"
            candidate_atom="${candidate_atom%.ebuild}::zed-overlay"
            candidate_version="${candidate_ebuild##*/zed-}"
            candidate_version="${candidate_version%.ebuild}"
            docker create --name zed-portage "$GENTOO_PORTAGE_IMAGE" /bin/true
            cleanup() {
              docker rm -f zed-portage >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            docker run --rm \
              --volumes-from zed-portage \
              --mount "type=bind,src=$disposable_workspace,dst=/overlay" \
              --workdir /overlay \
              --env CANDIDATE_ATOM="$candidate_atom" \
              --env CANDIDATE_EBUILD="/overlay/$candidate_ebuild" \
              --env CANDIDATE_PATCH="/overlay/$candidate_patch" \
              --env CANDIDATE_VERSION="$candidate_version" \
              "$GENTOO_STAGE3_IMAGE" \
              /bin/bash -e -c '
                mkdir -p /etc/portage/repos.conf /etc/portage/package.accept_keywords /etc/portage/package.use
                printf "%s\\n" \
                  "[DEFAULT]" \
                  "main-repo = gentoo" \
                  "" \
                  "[gentoo]" \
                  "location = /var/db/repos/gentoo" \
                  "auto-sync = no" \
                  "" \
                  "[zed-overlay]" \
                  "location = /overlay" \
                  "masters = gentoo" \
                  "auto-sync = no" \
                  > /etc/portage/repos.conf/zed-overlay.conf
                printf "%s ~amd64\\n" "$CANDIDATE_ATOM" \
                  > /etc/portage/package.accept_keywords/zed-candidate
                printf "%s\\n" \
                  "media-libs/vulkan-loader wayland" \
                  "media-video/pipewire sound-server" \
                  > /etc/portage/package.use/zed-validation
                ebuild "$CANDIDATE_EBUILD" manifest
                emerge --oneshot dev-util/pkgcheck
                pkgcheck scan --exit
                emerge -pv --oneshot "$CANDIDATE_ATOM"
                patch_root="$(mktemp -d)"
                tar -xzf "${DISTDIR}/zed-${CANDIDATE_VERSION}.tar.gz" -C "$patch_root"
                patch --dry-run -p1 -d "$patch_root/zed-${CANDIDATE_VERSION}" < "$CANDIDATE_PATCH"
              '

            test ! -e .git
            find . -type f -print0 | sort -z | cmp -s "$before_container_paths" -
            find . -type f ! -path './app-editors/zed/Manifest' -print0 | sort -z | xargs -0 sha256sum | cmp -s "$before_container_hashes" -
            ! cmp -s app-editors/zed/Manifest "$manifest_before_container"
          else
            grep -Fxq 'Result: up-to-date' "$prepare_log"
            test "${#candidate_paths[@]}" -eq 0
          fi

          PYTHONDONTWRITEBYTECODE=1 python3 scripts/overlay_policy.py \
            --root "$disposable_workspace" \
            --tracked-paths-file "$tracked_paths"
          test ! -e "$disposable_workspace/.git"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --short)"
