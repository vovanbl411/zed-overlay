---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    name: Overlay policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the overlay
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check overlay policy
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/overlay_policy.py

      # Проверяем синтаксис shell-скриптов: этот быстрый gate ловит ошибки разбора
      # и не требует отдельного линтера для shell.
      - name: Check CI shell syntax
        run: bash -n scripts/ci/*.sh

      - name: Run unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
