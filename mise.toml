[tools]
ruby = "3.3"
"gem:jekyll" = "3.10.0"

[tasks."docs:build"]
description = "Build the handbook into _site"
run = "jekyll build --safe --source docs --destination _site"

[tasks."docs:preview"]
description = "Serve the handbook locally and rebuild after edits"
run = "jekyll serve --safe --source docs --destination _site --host 127.0.0.1 --port 4000 --watch"
