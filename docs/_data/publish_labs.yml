workflow:
  - id: check
    name: check
    access: "contents: read"
    io: "Готовит handoff и bundle. Передаёт handoff_ready, archive_mode и metadata_sha256."
    remote: Может читать репозиторий. Загрузка артефактов пишет в хранилище Actions.
    lines: "25–35, 71–89"
  - id: validate
    name: validate-release-handoff
    access: "contents: read"
    io: "Получает оба артефакта, github.sha и metadata_sha256. Для допуска важен результат job."
    remote: Может читать репозиторий.
    lines: "107–147"
  - id: publish-job
    name: publish-draft-release-pr
    access: "contents: write, pull-requests: write"
    io: "Вход по handoff_ready, успеху validation и refs/heads/main. Checkout main и загрузка обоих артефактов."
    remote: Токен уже допускает запись. На этом этапе выполняются checkout и скачивание.
    lines: "149–180"
  - id: apply
    name: Apply validated release handoff
    access: Наследует разрешения задания
    io: "Сверяет чистый checkout и базовый коммит. Записывает файлы и выдаёт branch, candidate_version, patch_created."
    remote: Запись разрешена заданию. Этот шаг пишет локальные файлы и выходы Actions.
    lines: "182–199"
  - id: policy
    name: Check overlay policy after handoff apply
    access: Наследует разрешения задания
    io: "Читает overlay после применения handoff. Успех позволяет перейти к публикации crates."
    remote: Запись разрешена заданию. Этот шаг проверяет локальное дерево.
    lines: "201–202"
  - id: crates
    name: Publish validated crates release
    access: "Токен с contents: write"
    io: "Получает версию, режим, bundle, handoff, исходный Manifest и хеш метаданных. Возвращает publication_result."
    remote: Может опубликовать и проверить crates release или проверить существующий.
    lines: "204–220"
  - id: script
    name: publish-release-pr.sh
    access: "Токен с contents: write и pull-requests: write"
    io: "Получает выходы check, apply-handoff и publish-crates, а также путь к bundle."
    remote: В начале проверяет локальный Git diff. Дальнейший успешный путь может отправить ветку и открыть Draft PR.
    lines: "222–231"
